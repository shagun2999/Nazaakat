<!DOCTYPE html>
<html>
  <body>
    <!-- Exists only so Netlify registers the commission form at build time. Never shown to visitors. -->
    <form name="commission" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="contact" />
      <select name="craft"><option>Any</option></select>
      <input type="text" name="occasion" />
      <input type="text" name="quantity" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
